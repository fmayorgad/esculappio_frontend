<div class="linearModal">
  <bodycardtitle [title]=title [subtitle]=subtitle [icon]=icon [color]=color></bodycardtitle>

  <mat-dialog-content class="mat-typography">
    <form [formGroup]='mainForm'>
      <div class="row">

        <mat-form-field class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
          <mat-label>Anotación</mat-label>
          <textarea rows="4"  matInput placeholder="Escriba la anotación (máximo 500 palabras)" formControlName='idx' autocomplete="off"></textarea>
          <mat-error *ngIf="mainForm.controls.idx.hasError('required')">
            El campo es <strong>obligatorio</strong>.
          </mat-error>
          <mat-error *ngIf="mainForm.controls.idx.hasError('maxlength')">
            El campo debe tener máximo <strong>500 caracteres</strong>.
          </mat-error>
          <mat-error *ngIf="mainForm.controls.idx.hasError('minlength')">
            El campo debe tener mínimo <strong>5 caracteres</strong>.
          </mat-error>
        </mat-form-field>

      </div>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close color="warn">Cerrar</button>
    <button mat-raised-button class="successbutton" [disabled]="!mainForm.valid" (click)="create()">Registrar</button>
  </mat-dialog-actions>
</div>
