<div class="linearModal">
  <bodycardtitle [title]=title [subtitle]=subtitle [icon]=icon [color]=color></bodycardtitle>

  <mat-dialog-content class="mat-typography">
    <form [formGroup]='mainForm'>
      <div class="row">

        <div style="margin-top: 20px !important;" class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
          <p>Crear historia clínica pendiente de documentos para este usuario.</p>
        </div>

        <mat-form-field class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
          <mat-label>EPS origen</mat-label>
          <mat-select formControlName='eps'>
            <mat-option *ngFor="let ieps of eps" [value]="ieps.id">
              {{ieps.name}}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="mainForm.controls.eps.hasError('required')">
            El campo es <strong>obligatorio</strong>.
          </mat-error>
        </mat-form-field>

        <mat-form-field class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
          <mat-label>Organo</mat-label>
          <mat-select formControlName='organId'>
            <mat-option *ngFor="let organ of organs" [value]="organ.id">
              {{organ.name}}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="mainForm.controls.organId.hasError('required')">
            El campo es <strong>obligatorio</strong>.
          </mat-error>
        </mat-form-field>

      </div>
