<div class="mediumModal">
  <bodycardtitle [title]=title [subtitle]=subtitle [icon]=icon [color]=color></bodycardtitle>

  <mat-dialog-content class="mat-typography">

    <div class="row" style="margin-top: 20px !important;">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <h3>Completando documentos para el usuario: <strong style="text-transform: capitalize;">{{user}}</strong>
        </h3>
      </div>
    </div>

    <div class="row" style="margin-top: 30px !important; ">


      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">

        <mat-card class="flexi row">

          <div class="noPadding col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <h2 class="noMargin">Subir archivo</h2>
          </div>

          <input style="padding: 20px 0px;" class="col-lg-6 col-md-6 col-sm-12 col-xs-12" (change)="uploadFile($event)" type="file" id="avatar"
            name="avatar" accept="image/png, image/jpeg, application/pdf">

          <mat-form-field class="col-lg-4 col-md-4 col-sm-12 col-xs-12">
            <mat-select [(ngModel)]='fileType'>
              <mat-option [value]="'Biopsia'">
                Biopsia
              </mat-option>
              <mat-option [value]="'Imagenes médicas'">
                Imágenes
              </mat-option>

              <mat-option [value]="'Radioterapias'">
                Radioterapia
              </mat-option>

              <mat-option [value]="'Quimioterapia'">
                Quimioterapia
              </mat-option>

              <mat-option [value]="'Historia clínica'">
                Historia clínica
              </mat-option>


            </mat-select>

          </mat-form-field>

          <div class="col-lg-2 col-md-2 col-sm-12 col-xs-12" style="padding-top: 14px !important;">
            <button mat-raised-button class="successbutton" [(disabled)]="fileButton" (click)="upload()">Subir</button>
          </div>

        </mat-card>

      </div>



      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" style="margin-top: 50px;">
        <h2>Biopsia</h2>

        <table class="table">
          <thead>
            <tr>
              <th style="text-align: left;">Nombre del archivo</th>
              <th style="width:150px">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let b of userfiles.b">
              <td style="text-align: left;">{{b.name}}</td>
              <td style="text-align: center;">

                <button mat-mini-fab class="successbutton" (click)="getFile(b.id)" matTooltip="Descargar el archivo">
                  <mat-icon>cloud_download
                  </mat-icon>
                </button>

                <button mat-mini-fab class="errorbutton" (click)="deletefile(b.id)" matTooltip="Eliminar archivo">
                  <mat-icon>close</mat-icon>
                </button>

              </td>
            </tr>
          </tbody>
        </table>

      </div>

    </div>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close color="warn">Cerrar</button>
  </mat-dialog-actions>
</div>
