<breadcrumb></breadcrumb>
<mat-card class="mat-card-cardtitled" style="height: calc(100% - 33px);width: 100%;">
  <bodycardtitle [title]=title [subtitle]=subtitle [icon]=icon [color]=color></bodycardtitle>

  <div class="staticCardBody">

    <p>Listado de pagos.</p>

    <div style=" overflow-y: auto;">
      <table mat-table matSort [dataSource]="dataSourcePacients" #sortPacients="matSort" #tablePacients="matTable">
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef class="w300">Fecha </th>
          <td mat-cell *matCellDef="let element"> {{element.planStartDate}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="w300">Plan adquirido </th>
          <td mat-cell *matCellDef="let element"> {{element.plan.name}} </td>
        </ng-container>

        <ng-container matColumnDef="state">
          <th mat-header-cell *matHeaderCellDef class="w300"> Estado del pago </th>
          <td mat-cell *matCellDef="let element"> {{element.state.name}} </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="w200">Descripción plan adquirido</th>
          <td mat-cell *matCellDef="let element">
            {{element.plan.description}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="centered" width="200"> Acciones </th>
          <td mat-cell *matCellDef="let element; let i = index" class="pad10 actionsColumn">
            <div class="minifabcontainer actionsContainer gridi">
            
              <button mat-mini-fab class="infobutton" (click)="create(element)"
                matTooltip="Agregar cita realizada">
                <mat-icon>list</mat-icon>
              </button>

            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumnsPacients ; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumnsPacients; let i = index"></tr>
      </table>


      <nodata *ngIf="noDataPacients" [nodataheight]=nodataheight [nodatamessage]=nodatamessage></nodata>
      <div *ngIf="isLoadingPacients" style="display: flex; justify-content: center; align-items: center">
        <mat-progress-spinner color="primary" mode="indeterminate">
        </mat-progress-spinner>
      </div>

    </div>
    <mat-paginator #paginatorPacients="matPaginator" [pageSizeOptions]=mainTablePaginationOptionsPacients
      showFirstLastButtons></mat-paginator>
  </div>


</mat-card>
