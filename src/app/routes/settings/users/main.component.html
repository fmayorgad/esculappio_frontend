<breadcrumb></breadcrumb>
<mat-card class="mat-card-cardtitled" style="height: calc(100% - 33px);width: 100%;">
  <bodycardtitle [title]=title [subtitle]=subtitle [icon]=icon [color]=color></bodycardtitle>

  <div class="staticCardBody">

    <div class="searchTableContainer flexi">
      <div class="icon gridi">
        <mat-icon class="menu-icon mauto">search</mat-icon>
      </div>
      <mat-form-field>
        <mat-label>Buscar</mat-label>
        <input matInput (keyup)="applyFilter($event.target.value)"
          placeholder="Escribe la palabra o valor a buscar en esta tabla...">
      </mat-form-field>
    </div>

    <div style="height: 100%; overflow-y: auto;">
      <table mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="name" sticky>
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let element"> {{element.name}} {{element.lastname}} {{element.surname}}</td>
        </ng-container>

        <ng-container matColumnDef="email" sticky>
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let element"> {{element.email}}</td>
        </ng-container>

        <ng-container matColumnDef="profile" sticky>
          <th mat-header-cell *matHeaderCellDef>Perfil</th>
          <td mat-cell *matCellDef="let element"> {{element.profile.name}}</td>
        </ng-container>

        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="centered"> Acciones </th>
          <td mat-cell *matCellDef="let element; let i = index" class="actionsColumn">
            <div class="minifabcontainer actionsContainer gridi">
              <mat-slide-toggle class="mauto" (change)="editState(element.id, element.state)"
                [(ngModel)]="element.state" matTooltip="Activar/Inactivar Usuario"></mat-slide-toggle>
              <button mat-mini-fab class="infobutton" (click)="edit(element)" matTooltip="Editar usuario">
                <mat-icon>edit</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns; let i = index"></tr>
      </table>

      <nodata *ngIf="noData" [nodataheight]=nodataheight [nodatamessage]=nodatamessage></nodata>
      <div *ngIf="isLoading" style="display: flex; justify-content: center; align-items: center">
        <mat-progress-spinner color="primary" mode="indeterminate">
        </mat-progress-spinner>
      </div>
    </div>
    <mat-paginator [pageSizeOptions]=mainTablePaginationOptions showFirstLastButtons></mat-paginator>
  </div>

  <button class="successbutton floatAddButton" mat-fab aria-label="Create primary entity of this page"
    matTooltip="Crear Usuario administrativo" (click)="create()">
    <mat-icon>add</mat-icon>
  </button>

</mat-card>
