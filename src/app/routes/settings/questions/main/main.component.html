<mat-card class="mat-card-cardtitled" style="height: calc(100% - 33px);width: 100%;">
  <bodycardtitle [title]=title [subtitle]=subtitle [icon]=icon [color]=color></bodycardtitle>

  <div class="staticCardBody">
    <div style="height: 100%; overflow-y: auto;">
      <table mat-table [dataSource]="dataSourceAuditoria" matSort>

        <ng-container matColumnDef="name" sticky>
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>


        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="centered"> Acciones </th>
          <td mat-cell *matCellDef="let element; let i = index" class="pad10 actionsColumn">
            <div class="minifabcontainer actionsContainer gridi">
              <button mat-mini-fab class="successbutton" (click)="accept(request)"
                matTooltip="Listado de preguntas: {{element.name}}">
                <mat-icon>list</mat-icon>
              </button>
              <mat-slide-toggle class="mauto" (change)="changeEntityState(i, element.state, element.id)"
                [(ngModel)]="element.state" matTooltip="Activar/Inactivar Organo"></mat-slide-toggle>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns; let i = index"></tr>
      </table>

      <nodata *ngIf="noData" [nodataheight]=nodataheight [nodatamessage]=nodatamessage></nodata>
      <div *ngIf="isLoading" style="display: flex; justify-content: center; align-items: center">
        <mat-progress-spinner color="primary" mode="indeterminate">
        </mat-progress-spinner>
      </div>

    </div>
  </div>

</mat-card>
