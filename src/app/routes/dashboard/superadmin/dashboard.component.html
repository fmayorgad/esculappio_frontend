<breadcrumb></breadcrumb>

<mat-grid-list cols="6" rowHeight="100px" gutterSize="20">
    <mat-grid-tile [colspan]=" 2 " [rowspan]="3" >
      <mat-card class="mat-card-cardtitled" style="height: calc(100% - 33px);width: 100%;">
        <bodycardtitle [title]=cards.aud.title [subtitle]=cards.aud.subtitle [icon]=cards.aud.icon
          [color]=cards.aud.color></bodycardtitle>
          <mat-form-field>
            <mat-label>Choose a date</mat-label>
            <input matInput [matDatepicker]="picker">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
        
      </mat-card>
    </mat-grid-tile>
  
  
  </mat-grid-list>
